<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Impact','Arial Black',sans-serif}
.bg{fill:#0d1117}
.big{font-size:125px}
.sub{font-family:'Comic Sans MS','Comic Neue',cursive;font-size:19px;font-weight:bold}
.warn{font-family:'Courier New',monospace;font-size:13px;font-weight:bold;fill:#ffcc00}
.scan{animation:scan 2.2s linear infinite}
@keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(270px)}}
.r{fill:#ff0040;mix-blend-mode:screen;animation:jr 1.7s infinite steps(1)}
.c{fill:#00fff0;mix-blend-mode:screen;animation:jc 1.3s infinite steps(1)}
.m{fill:#fff}
@keyframes jr{0%{transform:translate(-5px,0)}12%{transform:translate(-11px,3px)}25%{transform:translate(-3px,-2px)}40%{transform:translate(-15px,0)}55%{transform:translate(-4px,2px)}70%{transform:translate(-9px,-4px)}85%{transform:translate(-2px,0)}100%{transform:translate(-5px,0)}}
@keyframes jc{0%{transform:translate(5px,0)}15%{transform:translate(12px,-3px)}30%{transform:translate(3px,2px)}45%{transform:translate(14px,0)}60%{transform:translate(4px,-2px)}75%{transform:translate(10px,4px)}90%{transform:translate(2px,0)}100%{transform:translate(5px,0)}}
.shake{transform-origin:400px 130px;animation:sh 3.3s infinite steps(1)}
@keyframes sh{0%,86%{transform:translate(0,0) skewX(0deg)}87%{transform:translate(9px,-3px) skewX(14deg)}88%{transform:translate(-12px,2px) skewX(-16deg)}89%{transform:translate(5px,0) skewX(7deg)}90%{transform:translate(-6px,3px) skewX(-4deg)}91%,100%{transform:translate(0,0) skewX(0deg)}}
.rainbow{animation:rb 2.5s linear infinite}
@keyframes rb{0%{fill:#ff0040}16%{fill:#ff9500}33%{fill:#ffee00}50%{fill:#2ea043}66%{fill:#00b7ff}83%{fill:#b44cff}100%{fill:#ff0040}}
.fl{animation:fl 3.1s infinite steps(1)}
@keyframes fl{0%,55%{opacity:1}56%{opacity:0}58%{opacity:1}60%{opacity:0}62%,100%{opacity:1}}
.e{font-size:34px;transform-box:fill-box;transform-origin:center;animation:fl2 2.4s ease-in-out infinite}
@keyframes fl2{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-20px) rotate(12deg)}}
.st{fill:#fff;animation:tw 1.6s infinite steps(1)}
@keyframes tw{0%{opacity:1}50%{opacity:.1}100%{opacity:1}}
</style>
