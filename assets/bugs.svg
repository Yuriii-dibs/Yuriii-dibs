<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Comic Sans MS','Comic Neue',cursive}
.bx{animation:run linear infinite}
@keyframes run{0%{transform:translateX(-60px)}100%{transform:translateX(860px)}}
.bw{font-size:26px;transform-box:fill-box;transform-origin:center;animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{0%{transform:translateY(-3px) rotate(-8deg)}100%{transform:translateY(3px) rotate(8deg)}}
.sq{font-size:15px;font-weight:bold;fill:#2ea043}
.cr{font-size:15px;font-weight:bold;fill:#ff4d4d;transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.ham{font-size:34px;transform-box:fill-box;transform-origin:85% 85%;animation:swing 1.4s ease-in infinite}
@keyframes swing{0%,55%{transform:rotate(-50deg)}70%{transform:rotate(30deg)}100%{transform:rotate(-50deg)}}
.miss{font-size:18px;font-weight:bold;fill:#ffee00;animation:miss 1.4s steps(1) infinite}
@keyframes miss{0%,68%{opacity:0}69%,90%{opacity:1}91%,100%{opacity:0}}
</style>
<rect width="800" height="150" rx="10" fill="#0d1117"/>
<text class="sq" x="20" y="30">BUGS SQUASHED: 0</text>
<text class="cr" x="720" y="30" text-anchor="middle">BUGS CREATED: ∞</text>
<rect x="0" y="136" width="800" height="14" fill="#1f6f2b"/>
<g transform="translate(0,70)"><g class="bx" style="animation-duration:9s;animation-delay:-2s"><text class="bw" style="animation-delay:-0.0s" x="0" y="0">🐛</text></g></g><g transform="translate(0,100)"><g class="bx" style="animation-duration:6.5s;animation-delay:-4s"><text class="bw" style="animation-delay:-0.17s" x="0" y="0">🐞</text></g></g><g transform="translate(0,125)"><g class="bx" style="animation-duration:11s;animation-delay:-7s"><text class="bw" style="animation-delay:-0.34s" x="0" y="0">🪲</text></g></g><g transform="translate(0,85)"><g class="bx" style="animation-duration:8s;animation-delay:-1s"><text class="bw" style="animation-delay:-0.51s" x="0" y="0">🐜</text></g></g><g transform="translate(0,112)"><g class="bx" style="animation-duration:5.5s;animation-delay:-3s"><text class="bw" style="animation-delay:-0.68s" x="0" y="0">🦟</text></g></g><g transform="translate(0,128)"><g class="bx" style="animation-duration:13s;animation-delay:-9s"><text class="bw" style="animation-delay:-0.8500000000000001s" x="0" y="0">🐛</text></g></g>
<text class="ham" x="388" y="120">🔨</text>
<text class="miss" x="372" y="62">MISS!</text>
</svg>