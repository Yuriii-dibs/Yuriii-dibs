<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 140" width="700" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Comic Sans MS','Comic Neue',cursive;fill:#fff}
.ti{font-size:21px;font-weight:bold}.pc{font-size:19px;font-weight:bold;fill:#ffee00}.msg{font-size:14px;fill:#ff9500}.er{font-size:14px;font-weight:bold;fill:#ff4d4d}
.fill{transform-box:fill-box;transform-origin:left center;animation:grow 9.0s infinite}
@keyframes grow{0%{transform:scaleX(0);animation-timing-function:cubic-bezier(.1,.8,.3,1)}55%{transform:scaleX(.99)}99%{transform:scaleX(.99)}100%{transform:scaleX(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes l0{0%,4%{opacity:1}4.01%,100%{opacity:0}}.l0{animation:l0 9.0s infinite}@keyframes l1{0%,4%{opacity:0}4.01%,10%{opacity:1}10.01%,100%{opacity:0}}.l1{animation:l1 9.0s infinite}@keyframes l2{0%,10%{opacity:0}10.01%,18%{opacity:1}18.01%,100%{opacity:0}}.l2{animation:l2 9.0s infinite}@keyframes l3{0%,18%{opacity:0}18.01%,32%{opacity:1}32.01%,100%{opacity:0}}.l3{animation:l3 9.0s infinite}@keyframes l4{0%,32%{opacity:0}32.01%,100%{opacity:1}}.l4{animation:l4 9.0s infinite}@keyframes lw{0%,55%{opacity:0}55.01%,88%{opacity:1}88.01%,100%{opacity:0}}.lw{animation:lw 9.0s infinite}@keyframes le{0%,88%{opacity:0}88.01%,100%{opacity:1}}.le{animation:le 9.0s infinite}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff0040"/><stop offset=".25" stop-color="#ff9500"/><stop offset=".5" stop-color="#ffee00"/><stop offset=".75" stop-color="#2ea043"/><stop offset="1" stop-color="#00b7ff"/></linearGradient></defs>
<rect width="700" height="140" rx="12" fill="#0d1117"/>
<text class="ti" x="30" y="42">Loading personality...</text>
<circle class="spin" cx="610" cy="35" r="10" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
<text class="pc l0" x="670" y="42" text-anchor="end">0%</text><text class="pc l1" x="670" y="42" text-anchor="end">13%</text><text class="pc l2" x="670" y="42" text-anchor="end">37%</text><text class="pc l3" x="670" y="42" text-anchor="end">81%</text><text class="pc l4" x="670" y="42" text-anchor="end">99%</text>
<rect x="30" y="58" width="640" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect class="fill" x="33" y="61" width="634" height="22" rx="5" fill="url(#g)"/>
<text class="msg lw" x="30" y="115">(this is taking longer than expected...)</text>
<text class="er le" x="30" y="115">ERROR: personality.dll not found. Falling back to: tired.</text>
</svg>